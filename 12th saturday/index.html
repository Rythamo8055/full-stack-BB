<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Memory Flip Card Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="game-container">
        <h1>Memory Flip Card Game</h1>
        
        <div class="difficulty-selection">
            <button class="difficulty-btn" data-difficulty="easy">Easy (4x3)</button>
            <button class="difficulty-btn active" data-difficulty="medium">Medium (4x4)</button>
            <button class="difficulty-btn" data-difficulty="hard">Hard (5x4)</button>
        </div>

        <div class="controls">
            <div class="timer">Time: 0s</div>
            <div class="moves">Moves: 0</div>
            <div class="stars">⭐⭐⭐</div>
        </div>
        
        <div class="game-board" id="game-board">
            <!-- Cards are generated by JavaScript -->
        </div>
        
        <button class="reset-button">Reset Game</button>
    </div>

    <!-- Win Modal -->
    <div id="winModal" class="modal">
        <div class="modal-content">
            <span class="close-button">×</span>
            <h2>Congratulations!</h2>
            <div class="final-stats">
                <p><strong>Time:</strong> <span id="finalTime">0</span>s</p>
                <p><strong>Moves:</strong> <span id="finalMoves">0</span></p>
                <p><strong>Rating:</strong> <span id="finalStars"></span></p>
            </div>
            <button id="playAgainBtn">Play Again</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
